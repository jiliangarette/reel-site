    <style>
      :root {
        --ink: #040816;
        --paper: #f8f9fd;
        --blue: #033cf8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: var(--ink);
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
        color: var(--paper);
        -webkit-font-smoothing: antialiased;
      }
      #ambient {
        position: fixed;
        inset: -8%;
        width: 116%;
        height: 116%;
        filter: blur(48px) saturate(1.2);
        opacity: 0.55;
        pointer-events: none;
      }
      video {
        position: relative;
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        object-fit: contain;
        background: transparent;
        cursor: pointer;
      }
      .ui {
        position: fixed;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--paper);
        background: rgba(4, 8, 22, 0.72);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 0 0 1px rgba(143, 180, 255, 0.28);
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      #sound {
        right: max(20px, env(safe-area-inset-right));
        bottom: max(20px, env(safe-area-inset-bottom));
        cursor: pointer;
      }
      #home {
        left: max(20px, env(safe-area-inset-left));
        bottom: max(20px, env(safe-area-inset-bottom));
      }
      #sound i {
        display: block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8fb4ff;
      }
      #sound.on i {
        background: var(--blue);
        box-shadow: 0 0 0 3px rgba(143, 180, 255, 0.5);
      }
      #sound:focus-visible,
      #home:focus-visible {
        outline: 2px solid #8fb4ff;
        outline-offset: 3px;
      }
      body.idle .ui {
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
      }
      body.idle {
        cursor: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .ui {
          transition: none;
        }
      }
    </style>

  <body>
    <canvas id="ambient" width="48" height="27" aria-hidden="true"></canvas>
    <video id="reel" src="/reel.mp4" poster="/poster.jpg" loop playsinline preload="auto" aria-label="Jilian Garette Abangan, 60-second reel"></video>
    <button class="ui" id="sound" type="button" aria-pressed="false"><i></i><span>Tap for sound</span></button>
    <a class="ui" id="home" href="https://jilian.dev">jilian.dev ↗</a>
    <script>
      const video = document.getElementById("reel");
      const sound = document.getElementById("sound");
      const label = sound.querySelector("span");
      const sync = () => {
        const on = !video.muted;
        sound.classList.toggle("on", on);
        sound.setAttribute("aria-pressed", String(on));
        label.textContent = on ? "Sound on" : "Tap for sound";
      };
      let locked = false;
      let unlockedAt = 0;
      const toggle = () => {
        if (performance.now() - unlockedAt < 600) return;
        video.muted = !video.muted;
        if (video.paused) video.play();
        sync();
        wake();
      };
      const unlock = () => {
        if (!locked) return;
        locked = false;
        unlockedAt = performance.now();
        video.muted = false;
        video.play().catch(() => {});
        sync();
        wake();
      };
      ["pointerdown", "keydown", "touchend"].forEach((ev) => document.addEventListener(ev, unlock, { capture: true }));
      let timer = 0;
      const wake = () => {
        document.body.classList.remove("idle");
        clearTimeout(timer);
        timer = setTimeout(() => document.body.classList.add("idle"), 2600);
      };
      sound.addEventListener("click", (e) => {
        e.stopPropagation();
        toggle();
      });
      video.addEventListener("click", toggle);
      document.addEventListener("keydown", (e) => {
        if (performance.now() - unlockedAt < 600) return;
        if (e.key === "m" || e.key === "M") toggle();
        if (e.key === " ") {
          e.preventDefault();
          video.paused ? video.play() : video.pause();
          wake();
        }
      });
      ["mousemove", "touchstart", "focusin"].forEach((ev) => document.addEventListener(ev, wake, { passive: true }));
      const amb = document.getElementById("ambient").getContext("2d");
      const paint = () => {
        if (video.readyState >= 2) amb.drawImage(video, 0, 0, 48, 27);
        requestAnimationFrame(paint);
      };
      requestAnimationFrame(paint);
      video.muted = false;
      video
        .play()
        .then(sync)
        .catch(() => {
          locked = true;
          video.muted = true;
          video.play().catch(() => {});
          sync();
        });
      sync();
      wake();
    </script>
  </body>
